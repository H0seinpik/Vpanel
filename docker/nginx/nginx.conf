# =============================================================================
# VPanel — nginx reverse proxy
#
# TLS terminates here. Replace the certificate paths with your own (see
# docs/DEPLOYMENT.md). The HTTP server only redirects to HTTPS.
# =============================================================================

# --- Shared proxy settings ----------------------------------------------------
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# --- Rate limiting ------------------------------------------------------------
# Coarse protection at the edge; the application enforces its own, stricter
# limits per route (login, refresh, sensitive operations).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

upstream vpanel_web {
    server web:3000;
    keepalive 32;
}

# --- HTTP → HTTPS -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS --------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # --- Certificates (replace with real paths) -------------------------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The app ships its own CSP-friendly assets; tighten this if you add CDNs.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;
    client_max_body_size 5m;

    # --- Compression ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # --- Health probe (unauthenticated, no logging noise) ---------------------
    location = /api/health {
        access_log off;
        proxy_pass http://vpanel_web;
    }

    # --- Auth endpoints: strict limit -----------------------------------------
    location ~ ^/api/auth/(login|refresh)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://vpanel_web;
    }

    # --- API ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://vpanel_web;
    }

    # --- Static assets: immutable, cache aggressively -------------------------
    location /_next/static/ {
        proxy_pass http://vpanel_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://vpanel_web;
        add_header Cache-Control "public, max-age=86400";
    }

    # --- Application ----------------------------------------------------------
    location / {
        proxy_read_timeout 90s;
        proxy_pass http://vpanel_web;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
        access_log off;
    }
}
