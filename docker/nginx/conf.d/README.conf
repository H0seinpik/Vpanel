# =============================================================================
# VPanel — nginx server block
#
# Kept separate from nginx.conf so the main file stays focused on http-level
# concerns (upstreams, limit zones, logging). Include this from nginx.conf:
#
#   include /etc/nginx/conf.d/*.conf;
# =============================================================================

# Placeholder server block. The authoritative configuration lives in
# docker/nginx/nginx.conf because the upstream and limit_req zones are declared
# at the http level and must stay in the same file.
#
# If you prefer to split the configuration, move the `server { }` blocks from
# docker/nginx/nginx.conf into this file and keep only the http-level directives
# (proxy_*, limit_req_zone, upstream, gzip) in nginx.conf.

server {
    listen 8080;
    server_name _;

    # Simple local probe for container orchestration.
    location / {
        return 200 "vpanel nginx placeholder\n";
        add_header Content-Type text/plain;
    }
}
